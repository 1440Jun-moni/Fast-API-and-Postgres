<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--surface:#0f1119;--surface-2:#151823;--border:#222636;--text:#eceef6;--muted:#8b90a7;
  --accent:#8b7cff;--accent-2:#4cc9f0;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;
  --grad:linear-gradient(135deg,#8b7cff,#4cc9f0);--r:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Sora','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(139,124,255,.16),transparent),radial-gradient(700px 400px at -5% 10%,rgba(76,201,240,.10),transparent);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(139,124,255,.35)}
.logo svg{width:22px;height:22px;stroke:#07080d}
h1{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.82rem}
.conn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 8px 6px 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 0 currentColor;color:var(--warn)}
.dot.on{background:var(--ok);color:var(--ok);animation:pulse 2.2s infinite}.dot.off{background:var(--bad);color:var(--bad)}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}}
.conn input{background:transparent;border:0;outline:0;width:190px;font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;transition:.25s}
.stat:hover{transform:translateY(-3px);border-color:#34395000;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;margin-top:4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px;border-bottom:1px solid var(--border)}
.field{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:0;transition:.2s;min-width:0}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,124,255,.18)}
.grow{flex:1 1 180px}
select.field{cursor:pointer}
.btn{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:#3a4060;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--grad);border:0;color:#07080d;font-weight:600;box-shadow:0 8px 22px rgba(139,124,255,.3)}
.btn.primary:hover:not(:disabled){box-shadow:0 12px 28px rgba(139,124,255,.45)}
.btn.danger{background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.4);color:var(--bad)}
.btn:focus-visible,.icon:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 16px;font-weight:500;background:rgba(255,255,255,.015)}
td{padding:14px 16px;border-top:1px solid var(--border);font-size:.92rem}
tbody tr{transition:background .2s;animation:rise .4s both}
tbody tr:hover{background:rgba(139,124,255,.06)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.who{display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.8rem;color:#07080d;flex:none}
.id{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:.82rem}
.muted{color:var(--muted)}
.chip{padding:3px 10px;border-radius:999px;background:rgba(139,124,255,.14);color:#c4bcff;font-size:.78rem}
.grade{font-weight:600;padding:3px 10px;border-radius:8px;font-size:.8rem}
.g-A{background:rgba(61,220,151,.14);color:var(--ok)}.g-B{background:rgba(76,201,240,.14);color:var(--accent-2)}
.g-C{background:rgba(255,184,77,.14);color:var(--warn)}.g-F{background:rgba(255,107,129,.14);color:var(--bad)}
.bar{height:5px;width:90px;background:var(--border);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.icon{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon:hover{background:var(--surface-2);border-color:#3a4060}.icon.del:hover{color:var(--bad);border-color:var(--bad)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.skel td div{height:16px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),#1d2130,var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text);font-family:var(--display);margin-bottom:6px}
.pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}
.pager div{display:flex;gap:8px;align-items:center}
.overlay{position:fixed;inset:0;background:rgba(3,4,8,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;transform:translateY(18px) scale(.97);transition:.3s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.overlay.open .modal{transform:none}
.modal h2{font-family:var(--display);font-size:1.15rem;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:6px}
.fg{margin-bottom:12px}.fg .field{width:100%}.fg .err{color:var(--bad);font-size:.75rem;margin-top:4px;min-height:0}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:99}
.toast{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--ok);padding:12px 16px;border-radius:10px;max-width:340px;font-size:.88rem;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:in .3s both}
.toast.error{border-left-color:var(--bad)}.toast.out{animation:out .3s forwards}
@keyframes in{from{opacity:0;transform:translateX(24px)}}@keyframes out{to{opacity:0;transform:translateX(24px)}}
.spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#07080d;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:760px){
  table,thead,tbody,tr,td{display:block;min-width:0}thead{display:none}
  tbody tr{margin:12px;border:1px solid var(--border);border-radius:14px;padding:6px 0;background:var(--surface-2)}
  td{border:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px}
  td::before{content:attr(data-l);color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
  td.name::before,td.act::before{display:none}.skel td::before{display:none}
  .conn{width:100%}.conn input{flex:1;width:auto}.toolbar .btn.primary{flex:1 1 100%;justify-content:center}
}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></div>
      <div><h1>Student Hub</h1><div class="sub">Records &amp; performance overview</div></div>
    </div>
    <div class="conn" title="FastAPI server URL">
      <span class="dot" id="dot"></span>
      <input id="api" value=" https://fast-api-and-postgres.onrender.com" spellcheck="false" aria-label="API base URL">
      <button class="btn" id="reconnect" style="padding:6px 12px">Connect</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><span>Total students</span><b id="sTotal">–</b></div>
    <div class="stat"><span>Avg marks (this page)</span><b id="sAvg">–</b></div>
    <div class="stat"><span>Top scorer (this page)</span><b id="sTop" style="font-size:1.25rem;padding-top:8px">–</b></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input class="field grow" id="fId" placeholder="Find by student ID (e.g. S001)" aria-label="Find by ID">
      <button class="btn" id="bFind">Find</button>
      <input class="field grow" id="fCourse" list="courses" placeholder="Filter by course" aria-label="Course filter">
      <datalist id="courses"></datalist>
      <select class="field" id="fSort" aria-label="Sort by">
        <option value="">Sort: default</option><option value="marks">Marks</option><option value="age">Age</option><option value="name">Name</option>
      </select>
      <select class="field" id="fOrder" aria-label="Order"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
      <button class="btn primary" id="bAdd">+ New student</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Student</th><th>ID</th><th>Course</th><th>Age</th><th>Marks</th><th>Grade</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden></div>
    <div class="pager">
      <span id="pInfo">–</span>
      <div>
        <select class="field" id="fLimit" aria-label="Rows per page" style="padding:7px 10px"><option>2</option><option>5</option><option selected>10</option><option>25</option><option>50</option></select>
        <button class="btn" id="prev">‹ Prev</button><span id="pNum">1</span><button class="btn" id="next">Next ›</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="formOv" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <form class="modal" id="form" novalidate>
    <h2 id="fTitle">New student</h2>
    <div class="grid2">
      <div class="fg"><label for="id">Student ID</label><input class="field" id="id" placeholder="S001" required><div class="err"></div></div>
      <div class="fg"><label for="age">Age</label><input class="field" id="age" type="number" min="1" max="100" required><div class="err"></div></div>
    </div>
    <div class="fg"><label for="name">Full name</label><input class="field" id="name" minlength="2" maxlength="50" required><div class="err"></div></div>
    <div class="fg"><label for="email">Email</label><input class="field" id="email" type="email" required><div class="err"></div></div>
    <div class="grid2">
      <div class="fg"><label for="course">Course</label><input class="field" id="course" maxlength="50" required><div class="err"></div></div>
      <div class="fg"><label for="marks">Marks (0–100)</label><input class="field" id="marks" type="number" min="0" max="100" required><div class="err"></div></div>
    </div>
    <div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="save">Save</button></div>
  </form>
</div>

<div class="overlay" id="delOv" role="alertdialog" aria-modal="true">
  <div class="modal" style="max-width:400px">
    <h2>Delete student?</h2>
    <p class="muted" id="delMsg"></p>
    <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="confirmDel">Delete</button></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const state = { page: 1, total: 0, editing: null, deleting: null, single: false };
  const FIELDS = ['id', 'name', 'age', 'email', 'course', 'marks'];
  const COLORS = ['#8b7cff', '#4cc9f0', '#3ddc97', '#ffb84d', '#ff8fab', '#7ae7c7'];
  const base = () => $('#api').value.trim().replace(/\/+$/, '');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icons = {
    edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    del: '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
  };

  function toast(msg, type = 'ok') {
    const t = document.createElement('div');
    t.className = 'toast ' + (type === 'error' ? 'error' : '');
    t.textContent = msg;
    $('#toasts').append(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3800);
  }

  // FastAPI errors: string detail or list of validation objects
  function errText(d) {
    if (!d) return 'Unexpected error';
    if (typeof d === 'string') return d;
    if (Array.isArray(d)) return d.map(e => `${(e.loc || []).slice(1).join('.')}: ${e.msg}`).join(' · ');
    return JSON.stringify(d);
  }
  async function api(path, opts = {}) {
    let res;
    try {
      res = await fetch(base() + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    } catch {
      setStatus('off');
      throw new Error('Cannot reach the server. Is FastAPI running and CORS enabled?');
    }
    setStatus('on');
    const data = await res.json().catch(() => null);
    if (!res.ok) { const e = new Error(errText(data && data.detail)); e.status = res.status; e.detail = data && data.detail; throw e; }
    return data;
  }
  function setStatus(s) { $('#dot').className = 'dot ' + s; }

  const grade = m => m >= 90 ? ['A+', 'A'] : m >= 80 ? ['A', 'A'] : m >= 70 ? ['B', 'B'] : m >= 60 ? ['C', 'C'] : ['F', 'F'];
  const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const color = id => COLORS[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];

  function skeleton() {
    $('#empty').hidden = true;
    $('#rows').innerHTML = Array(4).fill('<tr class="skel">' + '<td><div></div></td>'.repeat(7) + '</tr>').join('');
  }

  function render(list) {
    const body = $('#rows');
    $('#empty').hidden = list.length > 0;
    if (!list.length) {
      $('#empty').innerHTML = '<h3>No students found</h3><p>Try a different filter or add a new student.</p>';
      body.innerHTML = '';
    }
    body.innerHTML = list.map((s, i) => {
      const [g, cls] = grade(s.marks);
      return `<tr style="animation-delay:${i * 40}ms">
        <td class="name"><div class="who"><div class="av" style="background:${color(s.id)}">${esc(initials(s.name))}</div>
          <div><div>${esc(s.name)}</div><div class="muted" style="font-size:.78rem">${esc(s.email)}</div></div></div></td>
        <td data-l="ID" class="id">${esc(s.id)}</td>
        <td data-l="Course"><span class="chip">${esc(s.course)}</span></td>
        <td data-l="Age">${s.age}</td>
        <td data-l="Marks"><div>${s.marks}</div><div class="bar"><i style="width:0" data-w="${s.marks}"></i></div></td>
        <td data-l="Grade"><span class="grade g-${cls}">${esc(s.grade || g)}</span></td>
        <td class="act"><div class="actions">
          <button class="icon" data-edit="${esc(s.id)}" aria-label="Edit ${esc(s.name)}">${icons.edit}</button>
          <button class="icon del" data-del="${esc(s.id)}" aria-label="Delete ${esc(s.name)}">${icons.del}</button></div></td></tr>`;
    }).join('');
    requestAnimationFrame(() => body.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%'));
    state.list = list;
    const avg = list.length ? list.reduce((a, s) => a + s.marks, 0) / list.length : null;
    const top = list.reduce((a, s) => (!a || s.marks > a.marks ? s : a), null);
    $('#sAvg').textContent = avg === null ? '–' : avg.toFixed(1);
    $('#sTop').textContent = top ? `${top.name} · ${top.marks}` : '–';
    const dl = $('#courses');
    dl.innerHTML = [...new Set(list.map(s => s.course))].map(c => `<option value="${esc(c)}">`).join('');
  }

  async function load() {
    state.single = false;
    skeleton();
    const p = new URLSearchParams({ page: state.page, limit: $('#fLimit').value, order: $('#fOrder').value });
    if ($('#fCourse').value.trim()) p.set('course', $('#fCourse').value.trim());
    if ($('#fSort').value) p.set('sort_by', $('#fSort').value);
    try {
      const d = await api('/students?' + p);
      state.total = d.total_students;
      const pages = Math.max(1, Math.ceil(d.total_students / d.limit));
      if (d.page > pages) { state.page = pages; return load(); }
      $('#sTotal').textContent = d.total_students;
      $('#pNum').textContent = `${d.page} / ${pages}`;
      const from = d.total_students ? (d.page - 1) * d.limit + 1 : 0;
      $('#pInfo').textContent = `Showing ${from}–${from + d.students.length - 1 < from ? 0 : from + d.students.length - 1} of ${d.total_students}`;
      $('#prev').disabled = d.page <= 1;
      $('#next').disabled = d.page >= pages;
      render(d.students);
    } catch (e) {
      $('#rows').innerHTML = '';
      $('#empty').hidden = false;
      $('#empty').innerHTML = `<h3>Couldn’t load students</h3><p>${esc(e.message)}</p>`;
      toast(e.message, 'error');
    }
  }

  async function find() {
    const id = $('#fId').value.trim();
    if (!id) { state.page = 1; return load(); }
    skeleton();
    try {
      const s = await api('/student/' + encodeURIComponent(id));
      state.single = true;
      $('#pInfo').textContent = `Result for “${id}”`;
      $('#pNum').textContent = '1 / 1';
      $('#prev').disabled = $('#next').disabled = true;
      render([s]);
    } catch (e) {
      render([]);
      $('#empty').innerHTML = `<h3>${e.status === 404 ? 'No such student' : 'Search failed'}</h3><p>${esc(e.message)}</p>`;
    }
  }

  // ---- modal helpers
  function open(ov) { ov.classList.add('open'); }
  function close() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }
  document.addEventListener('keydown', e => e.key === 'Escape' && close());
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', e => e.target === o && close()));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));

  function clearErrors() { document.querySelectorAll('#form .err').forEach(e => e.textContent = ''); }
  function openForm(student) {
    state.editing = student ? student.id : null;
    $('#fTitle').textContent = student ? 'Edit student' : 'New student';
    clearErrors();
    FIELDS.forEach(f => $('#' + f).value = student ? student[f] : '');
    $('#id').disabled = !!student;
    open($('#formOv'));
    setTimeout(() => $(student ? '#name' : '#id').focus(), 80);
  }

  function validate() {
    clearErrors();
    let ok = true;
    const bad = (f, m) => { $('#' + f).parentElement.querySelector('.err').textContent = m; ok = false; };
    const v = f => $('#' + f).value.trim();
    if (!state.editing && !v('id')) bad('id', 'Required');
    if (v('name').length < 2 || v('name').length > 50) bad('name', '2–50 characters');
    else if (!v('name').replace(/ /g, '').match(/^\p{L}+$/u)) bad('name', 'Letters and spaces only');
    if (!/^\S+@\S+\.\S+$/.test(v('email'))) bad('email', 'Enter a valid email');
    if (!v('course') || v('course').length > 50) bad('course', 'Required (max 50)');
    const age = Number(v('age')), marks = Number(v('marks'));
    if (!v('age') || !Number.isInteger(age) || age < 1 || age > 100) bad('age', '1–100');
    if (v('marks') === '' || !Number.isInteger(marks) || marks < 0 || marks > 100) bad('marks', '0–100');
    return ok;
  }

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!validate()) return;
    const body = {};
    FIELDS.forEach(f => body[f] = $('#' + f).value.trim());
    body.age = +body.age; body.marks = +body.marks;
    const editing = state.editing;
    if (editing) delete body.id;
    const btn = $('#save');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
    try {
      await api(editing ? '/UpdateStudent/' + encodeURIComponent(editing) : '/CreateStudent',
        { method: editing ? 'PUT' : 'POST', body: JSON.stringify(body) });
      toast(editing ? 'Student updated' : 'Student created');
      close();
      state.single ? find() : load();
    } catch (err) {
      toast(err.message, 'error');
    } finally { btn.disabled = false; btn.textContent = 'Save'; }
  });

  // ---- table actions (event delegation)
  $('#rows').addEventListener('click', e => {
    const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]');
    if (ed) openForm(state.list.find(s => s.id === ed.dataset.edit));
    if (dl) {
      const s = state.list.find(x => x.id === dl.dataset.del);
      state.deleting = s.id;
      $('#delMsg').textContent = `${s.name} (${s.id}) will be permanently removed. This can’t be undone.`;
      open($('#delOv'));
    }
  });
  $('#confirmDel').addEventListener('click', async () => {
    const btn = $('#confirmDel');
    btn.disabled = true;
    try {
      await api('/DeleteStudent/' + encodeURIComponent(state.deleting), { method: 'DELETE' });
      toast('Student deleted');
      close();
      if (state.single) { $('#fId').value = ''; state.page = 1; }
      load();
    } catch (err) { toast(err.message, 'error'); }
    finally { btn.disabled = false; }
  });

  // ---- controls
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const reset = () => { state.page = 1; $('#fId').value = ''; load(); };
  $('#bAdd').addEventListener('click', () => openForm());
  $('#bFind').addEventListener('click', find);
  $('#fId').addEventListener('keydown', e => e.key === 'Enter' && find());
  $('#fCourse').addEventListener('input', debounce(reset, 350));
  ['#fSort', '#fOrder', '#fLimit'].forEach(s => $(s).addEventListener('change', reset));
  $('#prev').addEventListener('click', () => { state.page--; load(); });
  $('#next').addEventListener('click', () => { state.page++; load(); });
  $('#reconnect').addEventListener('click', () => { try { localStorage.setItem('hub-api', base()); } catch {} reset(); });

  try { const u = localStorage.getItem('hub-api'); if (u) $('#api').value = u; } catch {}
  load();
})();
</script>
</body>
</html>
